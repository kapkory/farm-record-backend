name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # queue deploys, never run two at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push code to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.env' --exclude='vendor' --exclude='node_modules' --exclude='storage/logs'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Run build and migrate on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 60m   # docker builds can be slow
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"
            ./deploy.sh --build --migrate
