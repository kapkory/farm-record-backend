name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # queue deploys, never run two at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 60m   # docker builds can be slow
          script: |
            cd ~/farm-record
            # Deterministically update the nested backend repo only — NOT the umbrella
            # checkout, which owns docker-compose.yml / deploy.sh. Resetting the umbrella
            # to the backend repo deletes the compose files and breaks the build.
            git -C farm-app-backend remote set-url origin "https://github.com/kapkory/farm-record-backend.git"
            git -C farm-app-backend fetch origin main
            git -C farm-app-backend reset --hard origin/main
            ./deploy.sh --build --migrate
